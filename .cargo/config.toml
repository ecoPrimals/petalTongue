# Compiler and linker optimizations for petalTongue UniBin.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# Faster incremental builds
codegen-units = 256

[profile.dev.package."*"]
# Optimize dependencies even in dev for acceptable UI perf
opt-level = 2

# --- Cross-compilation targets (Phase 2: Silicon Atheism) ---
# Android targets use NDK r25c+ (API level 21 = Android 5.0 Lollipop minimum).
# Set ANDROID_NDK_HOME to your NDK installation path.
# sporeGate harvest builds use these same settings.

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"

[target.i686-linux-android]
linker = "i686-linux-android21-clang"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[env]
# NDK toolchain path — appended to PATH for Android builds.
# Override with ANDROID_NDK_HOME env var if your NDK lives elsewhere.
ANDROID_NDK_TOOLCHAIN = { value = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin", relative = false, force = false }
