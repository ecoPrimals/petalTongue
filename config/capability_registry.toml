#
# Capability Registry — petalTongue
#
# Self-audit: verified against dispatch.rs (Wave 157a vertebrate evolution).
# Lists every JSON-RPC method petalTongue SERVES (as the visualization primal)
# and CONSUMES (from other primals).
#
# The served methods here MUST match the actual dispatch table in
# crates/petal-tongue-ipc/src/unix_socket_rpc_handlers/dispatch.rs

# ─── System / Health ─────────────────────────────────────────────────

[health]
owner = "petaltongue"
role = "server"
methods = [
    "health.check",
    "health.liveness",
    "health.readiness",
    "health.get",
]

[identity]
owner = "petaltongue"
role = "server"
methods = [
    "identity.get",
    "lifecycle.status",
]

[capabilities]
owner = "petaltongue"
role = "server"
methods = [
    "capabilities.list",
    "capability.list",
    "capability.announce",
    "capabilities.sensory",
    "capabilities.sensory.negotiate",
    "provider.register_capability",
]

[auth]
owner = "petaltongue"
role = "server"
methods = [
    "auth.check",
    "auth.mode",
    "auth.peer_info",
]

[btsp]
owner = "petaltongue"
role = "server"
methods = [
    "btsp.capabilities",
]

# ─── Visualization ───────────────────────────────────────────────────

[visualization]
owner = "petaltongue"
role = "server"
methods = [
    "visualization.capabilities",
    "visualization.export",
    "visualization.render",
    "visualization.render.dashboard",
    "visualization.render.grammar",
    "visualization.render.graph",
    "visualization.render.scene",
    "visualization.render.stream",
    "visualization.validate",
    "visualization.dismiss",
    "visualization.interact.apply",
    "visualization.interact.perspectives",
    "visualization.introspect",
    "visualization.panels",
    "visualization.showing",
    "visualization.session.list",
    "visualization.session.status",
    "visualization.texture.upload",
    "visualization.texture.attach",
    "visualization.scene.verify",
    "visualization.scene.declarative",
]

# ─── Interaction ─────────────────────────────────────────────────────

[interaction]
owner = "petaltongue"
role = "server"
methods = [
    "interaction.subscribe",
    "interaction.poll",
    "interaction.unsubscribe",
    "interaction.sensor_stream.subscribe",
    "interaction.sensor_stream.unsubscribe",
    "interaction.sensor_stream.poll",
]

# ─── Topology / Mesh ─────────────────────────────────────────────────

[topology]
owner = "petaltongue"
role = "server"
methods = [
    "topology.get",
    "gate.mesh.status",
    "proprioception.get",
]

# ─── UI / Motor ──────────────────────────────────────────────────────

[ui]
owner = "petaltongue"
role = "server"
methods = [
    "ui.render",
    "ui.display_status",
]

[motor]
owner = "petaltongue"
role = "server"
methods = [
    "motor.set_panel",
    "motor.set_zoom",
    "motor.fit_to_view",
    "motor.set_mode",
    "motor.navigate",
    "motor.set_awakening",
    "motor.panel.update",
    "motor.notification",
]

# ─── Audio ───────────────────────────────────────────────────────────

[audio]
owner = "petaltongue"
role = "server"
methods = [
    "audio.synthesize",
]

# ─── Methods petalTongue CONSUMES ────────────────────────────────────

[content]
owner = "content-provider"
role = "client"
consumed_by = "web_mode::content_backend"
methods = [
    "content.get",
    "content.resolve",
]

[discovery]
owner = "discovery-service"
role = "client"
consumed_by = "primal_registration"
methods = [
    "ipc.register",
    "ipc.resolve",
]

# ─── Meta-Tier Signal Participation ──────────────────────────────────
#
# petalTongue participates in 3 meta signals:
# - meta.intent: STARTS loop (capture_intent via interaction.poll)
# - meta.render: ENDS loop (render_output via visualization.render)
# - meta.observe: participates (render_state via visualization.render.stream)

[signals.meta]
tier = "meta"
role = "participant"
signals = [
    { name = "intent", role = "entry", capability = "interaction.poll" },
    { name = "render", role = "exit", capability = "visualization.render" },
    { name = "observe", role = "participant", capability = "visualization.render.stream" },
]

# ─── Network fallbacks (registry > env > const) ─────────────────────
#
# Ports are discovery fallbacks, not authoritative endpoints.
# Runtime resolution via ipc.resolve / HTTP probing takes precedence.

[network.fallbacks]
web_port = 3000
headless_port = 8080
websocket_port = 8765
sandbox_security_port = 9000
sandbox_discovery_port = 8080
display_backend_port = 9001
tcp_fallback_port = 9900
discovery_ports = [8080, 8081, 3000, 9000, 9900]
loopback_host = "127.0.0.1"
bind_host = "0.0.0.0"
gpu_compute_endpoint = "tarpc://localhost:9001"
legacy_tmp_prefix = "/tmp"
alternative_run_dir = "/var/run/ecoPrimals"

[network.capability_ports]
visualization = 3000
interaction = 3000
discovery = 8080
compute = 9001
security = 9000

# ─── Test fixtures ───────────────────────────────────────────────────

[test_fixtures]
owner = "tests"
methods = [
    "test.method",
]

[false_positives]
owner = "none"
methods = [
    "index.html",
]
